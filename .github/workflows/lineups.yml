name: Update lineups

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * *"

permissions:
  contents: write

concurrency:
  group: lineups
  cancel-in-progress: false

jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_lineups.py
      - run: python fetch_cup.py
